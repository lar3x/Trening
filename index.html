<!doctype html>
<html lang="sl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Trening</title>
  <meta name="description" content="Osebni dnevnik treningov, cardia in telesnih meritev.">
  <meta name="theme-color" content="#2d1013">
  <meta name="color-scheme" content="dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Trening">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/app.css">
  <script>
    // Barva pred prvim izrisom, da ne utripne privzeta modra.
    (function () {
      try {
        var map = { blue: ['#2563eb', '#1e3a8a', '#6ea8ff', '#fff'], red: ['#c4261f', '#661714', '#ff6f66', '#fff'], teal: ['#0f7f74', '#0b4943', '#3ddbc6', '#fff'], green: ['#1a7f3a', '#0f4721', '#5ee08a', '#fff'], orange: ['#c2510c', '#6e2d06', '#ff9a4d', '#fff'], violet: ['#7c3aed', '#3f1d8a', '#b49bff', '#fff'], pink: ['#be2468', '#6b1239', '#ff7ab3', '#fff'], yellow: ['#f0bf2c', '#7a5a07', '#ffd45c', '#1a1400'] };
        var d = JSON.parse(localStorage.getItem('gymapp') || '{}');
        var a = map[(d.settings && d.settings.accent) || 'red'] || map.red;
        var r = document.documentElement.style;
        r.setProperty('--accent', a[0]); r.setProperty('--accent-deep', a[1]); r.setProperty('--accent-text', a[2]); r.setProperty('--on-accent', a[3]);
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <main id="screen" class="screen"></main>
  <nav id="tabbar" class="tabbar" aria-label="Zasloni"></nav>
  <noscript><p style="padding:24px">Aplikacija potrebuje JavaScript.</p></noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
